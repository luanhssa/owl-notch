# Validation only — neither job here tags, publishes, or creates a
# GitHub Release. They just run `swift test`/`swift build -c release`
# against whatever ref triggered the workflow (a PR's own branch, or
# main after a merge) to catch build/test failures before merge.
# Versioning (bumping Resources/Info.plist, `git tag`, pushing the tag)
# is a manual step performed only on `main` after a PR is merged — it
# never happens here, and never from an unmerged PR branch.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (debug)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: swift test
        run: swift test

  build-release:
    # Named for the build *configuration* (Release, i.e. optimized) this
    # job compiles with — not a signal that anything is being shipped.
    name: Build (Release configuration)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: swift build
        run: swift build -c release
