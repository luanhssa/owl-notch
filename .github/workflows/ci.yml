name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (debug)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: swift test
        run: swift test

  build-release:
    name: Build (release)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: swift build
        run: swift build -c release
